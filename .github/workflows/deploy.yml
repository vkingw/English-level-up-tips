name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run check
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published entry points
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          entries=(
            $'/|人生进阶指南'
            $'/en/|Life Level-up Guide'
            $'/threads/part-3/5-evidence-and-transfer|证据篇：变化要如何被看见'
            $'/en/threads/part-3/5-evidence-and-transfer|Evidence: How Change Becomes Visible'
          )
          for entry in "${entries[@]}"; do
            IFS='|' read -r path expected_title <<< "$entry"
            url="${PAGE_URL%/}${path}"
            body="$(curl --fail --location --retry 8 --retry-delay 5 --connect-timeout 15 --max-time 45 "$url")"
            if ! grep -Fq "$expected_title" <<< "$body"; then
              printf 'Unexpected title for %s; expected %s\n' "$url" "$expected_title" >&2
              exit 1
            fi
            if ! grep -Fq "name=\"build-revision\" content=\"$EXPECTED_SHA\"" <<< "$body"; then
              printf 'Unexpected build revision for %s; expected %s\n' "$url" "$EXPECTED_SHA" >&2
              exit 1
            fi
          done
