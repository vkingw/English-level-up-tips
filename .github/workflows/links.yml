name: Scheduled External Link Check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --max-retries 2
            --timeout 20
            --exclude-path node_modules
            --exclude "https://localhost"
            "**/*.md"
          fail: true
      - uses: peter-evans/create-issue-from-file@v6
        if: failure()
        with:
          title: "Scheduled external-link check failed"
          content-filepath: ./lychee/out.md
          labels: broken-link,automation
